[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predicato"
version = "0.1.0"
description = "Python client for Predicato knowledge graph framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Predicato Team" }
]
keywords = ["knowledge-graph", "ingestion", "ai", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
crawler = [
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.2.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=24.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "gliner2>=0.1.0",
    "urllib3>=2.0.0",
    "requests>=2.0.0",
]
all = [
    "predicato[crawler]",
]

[project.urls]
Homepage = "https://github.com/soundprediction/predicato"
Documentation = "https://github.com/soundprediction/predicato/tree/main/python"
Repository = "https://github.com/soundprediction/predicato"

[tool.hatch.build.targets.wheel]
packages = ["predicato"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
